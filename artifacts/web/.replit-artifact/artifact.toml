kind = "web"
previewPath = "/"
title = "Nexa Eletrônicos"
description = "Uma loja online completa de eletrônicos com catálogo pesquisável, carrinho, checkout com frete, área do cliente e painel administrativo com produtos e métricas."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "artifacts/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
