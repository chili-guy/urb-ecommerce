openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: shipping
    description: Shipping quotes and delivery options
  - name: orders
    description: Order creation and order history
  - name: profile
    description: Customer profile operations
  - name: customer-auth
    description: Customer account authentication
  - name: dashboard
    description: Store performance metrics
  - name: admin-auth
    description: Restricted store team authentication
  - name: admin-users
    description: Restricted store team management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
  /shipping/quote:
    post:
      operationId: getShippingQuote
      tags: [shipping]
      summary: Calculate delivery options
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingQuoteInput"
      responses:
        "200":
          description: Delivery options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingOption"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for a customer
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the demo customer profile
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /auth/register:
    post:
      operationId: registerCustomer
      tags: [customer-auth]
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and customer authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "400":
          description: Invalid registration data
        "409":
          description: E-mail already registered
        "429":
          description: Too many attempts
  /auth/login:
    post:
      operationId: loginCustomer
      tags: [customer-auth]
      summary: Sign in to a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      operationId: logoutCustomer
      tags: [customer-auth]
      summary: Sign out of a customer account
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCustomerSession
      tags: [customer-auth]
      summary: Get the current customer session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "401":
          description: Authentication required
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [customer-auth]
      summary: Request a password reset link by e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "202":
          description: If the e-mail is registered, a reset link was sent
        "429":
          description: Too many attempts
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [customer-auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated and customer authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "400":
          description: Invalid or expired token
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get store metrics
      responses:
        "200":
          description: Store metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Sign in to the store administration area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Authenticated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials
        "429":
          description: Too many login attempts
  /admin/auth/setup-status:
    get:
      operationId: getAdminSetupStatus
      tags: [admin-auth]
      summary: Check whether the first administrator still needs to be configured
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetupStatus"
  /admin/auth/setup:
    post:
      operationId: adminSetup
      tags: [admin-auth]
      summary: Configure the first administrator with an environment-controlled secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "201":
          description: First administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Invalid setup data
        "401":
          description: Invalid setup secret
        "409":
          description: An administrator is already configured
        "429":
          description: Too many setup attempts
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Sign out of the store administration area
      responses:
        "204":
          description: Signed out
  /admin/auth/me:
    get:
      operationId: getAdminSession
      tags: [admin-auth]
      summary: Get the current administration session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Authentication required
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      summary: List store team users
      responses:
        "200":
          description: Store team users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
    post:
      operationId: createAdminUser
      tags: [admin-users]
      summary: Create a store team user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid user
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin-users]
      summary: Update a store team user
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid user
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: User not found
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [orders]
      summary: List all orders for the store team
      responses:
        "200":
          description: Store orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Authentication required
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    AdminUserId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, slug, description, category, price, stock, imageUrl, featured, rating, reviewCount]
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        stock: { type: number }
        imageUrl: { type: string }
        featured: { type: boolean }
        rating: { type: number }
        reviewCount: { type: number }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, description, category, price, stock, imageUrl]
      properties:
        name: { type: string, minLength: 2 }
        description: { type: string, minLength: 2 }
        category: { type: string, minLength: 2 }
        price: { type: number, minimum: 0 }
        compareAtPrice: { type: ["number", "null"], minimum: 0 }
        stock: { type: number, minimum: 0 }
        imageUrl: { type: string }
        featured: { type: boolean, default: false }
    ProductUpdate:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
      description: Product fields to update
    ShippingQuoteInput:
      type: object
      required: [postalCode, items]
      properties:
        postalCode: { type: string, minLength: 8 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
    ShippingOption:
      type: object
      required: [id, carrier, service, price, deliveryDays, description]
      properties:
        id: { type: string }
        carrier: { type: string }
        service: { type: string }
        price: { type: number }
        deliveryDays: { type: number }
        description: { type: string }
    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: number, minimum: 1 }
        quantity: { type: number, minimum: 1 }
    OrderItem:
      type: object
      required: [productId, productName, quantity, unitPrice, total]
      properties:
        productId: { type: number }
        productName: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        total: { type: number }
    Order:
      type: object
      required: [id, customerName, customerEmail, status, subtotal, shipping, total, shippingOption, items, createdAt]
      properties:
        id: { type: number }
        customerName: { type: string }
        customerEmail: { type: string }
        status: { type: string }
        subtotal: { type: number }
        shipping: { type: number }
        total: { type: number }
        shippingOption: { $ref: "#/components/schemas/ShippingOption" }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt: { type: string, format: date-time }
    OrderInput:
      type: object
      required: [customerName, customerEmail, postalCode, shippingOptionId, items]
      properties:
        customerName: { type: string, minLength: 2 }
        customerEmail: { type: string }
        postalCode: { type: string, minLength: 8 }
        shippingOptionId: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
    Profile:
      type: object
      required: [id, name, email]
      properties:
        id: { type: number }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
    ProfileUpdate:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string }
        phone: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
    DashboardSummary:
      type: object
      required: [revenue, revenueChange, orders, ordersChange, customers, products, inventoryUnits, lowStock, salesByDay, topProducts, recentOrders]
      properties:
        revenue: { type: number }
        revenueChange: { type: number }
        orders: { type: number }
        ordersChange: { type: number }
        customers: { type: number }
        products: { type: number }
        inventoryUnits: { type: number }
        lowStock: { type: number }
        salesByDay:
          type: array
          items:
            $ref: "#/components/schemas/SalesPoint"
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/RecentOrder"
    SalesPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    TopProduct:
      type: object
      required: [name, sales, revenue]
      properties:
        name: { type: string }
        sales: { type: number }
        revenue: { type: number }
    RecentOrder:
      type: object
      required: [id, customerName, total, status, createdAt]
      properties:
        id: { type: number }
        customerName: { type: string }
        total: { type: number }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    AdminRole:
      type: string
      enum: [admin, operator]
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
    AdminSetupStatus:
      type: object
      required: [needsSetup]
      properties:
        needsSetup: { type: boolean }
    AdminSetupInput:
      type: object
      required: [name, email, password, setupSecret]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 12 }
        setupSecret: { type: string, minLength: 8 }
    AdminUser:
      type: object
      required: [id, name, email, role, active, lastLoginAt, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        email: { type: string }
        role:
          $ref: "#/components/schemas/AdminRole"
        active: { type: boolean }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminUserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
        role:
          $ref: "#/components/schemas/AdminRole"
    AdminUserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
        role:
          $ref: "#/components/schemas/AdminRole"
        active: { type: boolean }
    AdminSession:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
    Customer:
      type: object
      required: [id, name, email, phone, postalCode, city, state, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    CustomerSession:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/Customer"
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, minLength: 5 }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 5 }
        password: { type: string, minLength: 1 }
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 5 }
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 10 }
        password: { type: string, minLength: 8 }

